---
- name: Deploy/upgrade DeployGate via Helm
  hosts: k3s
  become: true
  become_user: ubuntu
  vars:
    chart_path: /home/ubuntu/deploygate
    release_name: deploygate
    image_tag: latest

  tasks:
    - name: Upgrade or install the Helm release
      command: >
        helm upgrade --install {{ release_name }} {{ chart_path }}
        --set image.tag={{ image_tag }}
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: helm_result

    - name: Show Helm output
      debug:
        var: helm_result.stdout_lines

    - name: Wait for deploygate pod to be ready
      command: >
        kubectl wait --for=condition=ready pod
        -l app=deploygate --timeout=120s
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: rollout_status

    - name: Show rollout status
      debug:
        var: rollout_status.stdout_lines
