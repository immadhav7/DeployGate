# ─────────────────────────────────────────────────────────────────────────────
# GIT File Processor – Application Configuration
# Port is configurable here or via command-line: --server.port=9090
# ─────────────────────────────────────────────────────────────────────────────

# Server port (override with: java -jar git-file-processor.jar --server.port=9090)
server.port=8081

# Application name
spring.application.name=git-file-processor

# ── Multipart / File Upload ──────────────────────────────────────────────────
# Increase limits to support large Excel files (50 000+ rows)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.example.gitprocessor=INFO
logging.level.org.springframework.web=WARN
# On Linux, write to file:
# logging.file.name=/var/log/git-file-processor/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── HTTP Session ──────────────────────────────────────────────────────────────
# Session timeout (store processed files per user session)
server.servlet.session.timeout=30m

spring.datasource.url=jdbc:postgresql://localhost:5432/deploygate
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ── Deployment Request Module ─────────────────────────────────────────────────
# File storage location for uploaded deployment Excels
deployment.storage.path=./deployment-files

# Jackson: serialize dates as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false
